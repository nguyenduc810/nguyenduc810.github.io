<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name · AI / Machine Learning Researcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Newsreader:opsz,wght@6..72,300..700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ─── Navigation ──────────────────────────────────────────────────────── -->
<nav>
  <div class="wrap">
    <div class="brand">Your Name</div>
    <div class="navlinks">
      <a href="#about">Bio</a>
      <a href="#publications">Papers</a>
      <a href="#news">News</a>
      <a href="#edu">Education</a>
    </div>
    <div class="navtools">
      <button id="themeBtn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- ─── Hero ────────────────────────────────────────────────────────────── -->
<header id="about">
  <svg class="poly" viewBox="0 0 1440 620" preserveAspectRatio="none">
    <polygon points="0,90 760,40 1100,260 540,360 0,300"  fill="var(--poly-a)"/>
    <polygon points="1440,120 980,200 1200,420 1440,360"   fill="var(--poly-b)"/>
    <polygon points="120,620 700,360 1000,560 1440,500 1440,620" fill="var(--poly-a)"/>
    <polygon points="0,540 360,400 520,620 0,620"          fill="var(--poly-b)"/>
  </svg>
  <div class="wrap">
    <div id="hero-grid" class="hero-grid reveal">
      <!-- injected by main.js from data/profile.json -->
    </div>
  </div>
</header>

<!-- ─── Ticker ──────────────────────────────────────────────────────────── -->
<div class="ticker">
  <div class="tag">News</div>
  <div id="ticker-track" class="track">
    <!-- injected by main.js from data/news.json -->
  </div>
</div>

<!-- ─── Publications ────────────────────────────────────────────────────── -->
<section id="publications" class="reveal">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="sec-title">Publications</h2>
      <span class="hint">selected · see all on Google Scholar</span>
    </div>
    <div id="pub-list">
      <!-- injected by main.js from data/publications.json -->
    </div>
  </div>
</section>

<!-- ─── News ────────────────────────────────────────────────────────────── -->
<section id="news" class="reveal">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="sec-title">Latest News</h2>
      <span class="hint">scroll to see more</span>
    </div>
    <div class="news-viewport">
      <div id="news-list">
        <!-- injected by main.js from data/news.json -->
      </div>
    </div>
  </div>
</section>

<!-- ─── Footer ──────────────────────────────────────────────────────────── -->
<footer id="site-footer">
  <!-- injected by main.js -->
</footer>

<script src="assets/js/main.js" type="module"></script>
</body>
</html>
